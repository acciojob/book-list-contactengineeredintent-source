<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>

<body>
	<!-- the entire body must be written by student -->
    <header class="d-flex justify-content-center p-1 m-4">
      <h1>My<span class="highlight">Book</span>List</h1>
    </header>
    <main>
      <div class="form-group">
        <form id="form" class="d-flex flex-column align-items-left p-5">
          <div>
            <label for="title" class="form-label">Title</label>
            <br />
            <input id="title" type="text" class="form-control" required />
          </div>
          <div>
            <label for="author" class="form-label">Author</label>
            <br />
            <input type="text" id="author" class="form-control" required />
          </div>
          <div>
            <label for="isbn" class="form-label">ISBN</label>
            <br />
            <input type="text" id="isbn" class="form-control" required />
          </div>
          <br />
          <button type="submit" id="submit" class="btn btn-primary">
            Submit
          </button>
        </form>
        <!-- table section -->
        <div class="p-5">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN#</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
	<script type="text/javascript" src="./script.js">
</script>

</body>

</html>
